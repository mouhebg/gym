<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c0d0f">
<meta name="description" content="Four-day training plan with set logging, progress charts and a Google Sheet log.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Weekly Gym Plan</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,600..900&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500;600&display=swap">
<style>
/* Layout: a training-app shell — wordmark bar, four session tiles, then one column of workout cards with media on top; floating rest-timer pill. */
:root{
  --bg:#f2f2ef; --panel:#ffffff; --ink:#0f1012; --muted:#686c73; --line:#e1e1dc; --well:#ebebe6;
  --red:#d13438; --blue:#2364d2; --yellow:#b7791f; --green:#1f8a53;
  --figure:#1d1f23; --far:#b6b9be; --equip:#9a9ea5;
  --ok:#1f8a53; --warn:#b7791f; --onaccent:#ffffff; --onok:#ffffff;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --accent:var(--red); --r:16px;
  --leanfill:#1d1f23; --leantext:#ffffff;
  --belt:#7a4a2a; --beltdark:#4a2a16; --buckle:#a8adb4; --butter:#f6d870; --butterband:#ffffff; --heat:#e5484d; --muscle0:#dcdcd6; --bodybase:#e9e9e4;
  --accent-soft:color-mix(in srgb,var(--red) 28%,transparent);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c0d0f; --panel:#15171a; --ink:#edeef0; --muted:#8b9099; --line:#25282d; --well:#1c1f23;
  --red:#ef5559; --blue:#5b9cf8; --yellow:#f2b544; --green:#3fbf7f;
  --figure:#e3e5e8; --far:#4a4f57; --equip:#5f656e; --ok:#3fbf7f; --warn:#f2b544; --onaccent:#0c0d0f; --onok:#0c0d0f; --leanfill:#e3e5e8; --leantext:#0c0d0f; --belt:#8a5634; --beltdark:#4f2d18; --buckle:#c9ced5; --butter:#f2d266; --butterband:#fff8dc; --heat:#ff5a5f; --muscle0:#2a2e34; --bodybase:#1f2328; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0d0f; --panel:#15171a; --ink:#edeef0; --muted:#8b9099; --line:#25282d; --well:#1c1f23;
  --red:#ef5559; --blue:#5b9cf8; --yellow:#f2b544; --green:#3fbf7f;
  --figure:#e3e5e8; --far:#4a4f57; --equip:#5f656e; --ok:#3fbf7f; --warn:#f2b544; --onaccent:#0c0d0f; --onok:#0c0d0f; --leanfill:#e3e5e8; --leantext:#0c0d0f; --belt:#8a5634; --beltdark:#4f2d18; --buckle:#c9ced5; --butter:#f2d266; --butterband:#fff8dc; --heat:#ff5a5f; --muscle0:#2a2e34; --bodybase:#1f2328; color-scheme:dark}
*{box-sizing:border-box}
html{touch-action:manipulation;font-size:112.5%}
body{background:var(--bg);color:var(--ink);font:1rem/1.55 var(--body);-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-font-smoothing:antialiased}
a,button,input,select,summary,canvas,.photo{touch-action:manipulation}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 140px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.02;text-wrap:balance}
h2{font-size:clamp(2.1rem,9vw,2.9rem);font-weight:850;font-stretch:112%;letter-spacing:-.02em}
h3{font-size:1.25rem;font-weight:750;font-stretch:104%;letter-spacing:-.01em}
a{color:inherit}
/* app bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px 14px}
.top h1{font-size:.8rem;font-weight:800;font-stretch:125%;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.status{font:500 .74rem var(--mono);color:var(--muted);display:flex;align-items:center;gap:7px;min-width:0;white-space:nowrap}
.status span{overflow:hidden;text-overflow:ellipsis}
.status i{flex:none}
.status i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.status[data-s="saved"] i{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.status[data-s="saving"] i{background:var(--warn)} .status[data-s="error"] i{background:var(--red)}
/* navigation */
nav{display:grid;gap:12px}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.days a{display:grid;gap:2px;padding:10px 10px 9px;border-radius:12px;background:var(--panel);text-decoration:none;color:var(--ink);border:1px solid var(--line);min-width:0}
.days .dk{display:flex;align-items:center;gap:6px;font:600 .7rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.days .dk::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.days .dn{font:780 1rem/1.1 var(--display);font-stretch:108%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.days .dp{font:500 .66rem var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:clip}
.days a[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.days a[aria-current="page"] .dk,.days a[aria-current="page"] .dp{color:color-mix(in srgb,var(--bg) 70%,var(--ink))}
.links{display:grid;grid-template-columns:1fr;gap:6px}
.links a{display:flex;align-items:center;justify-content:center;text-align:center;min-height:44px;padding:8px 6px;border-radius:12px;text-decoration:none;font-weight:600;font-size:.88rem;line-height:1.2;color:var(--ink);background:var(--panel);border:1px solid var(--line)}
.links a.prog{justify-content:flex-start;gap:10px;padding:12px 16px;min-height:52px;background:var(--ok);color:var(--onok);border:0;font-size:1rem}
.links a.prog svg{width:20px;height:20px;flex:none}
.links a.prog .pl{font:780 1.05rem var(--display);font-stretch:108%}
.links a.prog .ps{margin-left:auto;font:600 .74rem var(--mono);background:color-mix(in srgb,var(--onok) 16%,transparent);padding:4px 9px;border-radius:999px;white-space:nowrap}
.links a.prog[aria-current="page"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ok)}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* section heads */
.dayhead{padding-block:26px 8px;display:grid;gap:10px}
.eyebrow{font:600 .72rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.meta{color:var(--muted);font-size:.95rem;margin:0}
.datebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:500 .78rem var(--mono);color:var(--muted)}
.datebar input{font:500 .8rem var(--mono);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
#setcount{color:var(--ink)}
#sestime{flex-basis:100%}
.note{font-size:.88rem;color:var(--muted);margin:8px 0 0}
.block{background:var(--panel);border-radius:var(--r);padding:18px;margin-top:12px}
.block h3{margin-bottom:10px}
.block ul,.block ol{margin:6px 0 0;padding-left:18px}
.block li+li{margin-top:5px}
.block li::marker{color:var(--muted)}
details.block{padding:0}
/* exercise cards */
.ex{background:var(--panel);border-radius:var(--r);margin-top:14px;overflow:hidden}
.ex-head{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;padding:16px 16px 12px;align-items:baseline}
.ex-no{font:600 .8rem var(--mono);color:var(--accent);grid-row:span 2;letter-spacing:.04em}
.rx{margin:0;font:500 .82rem var(--mono);color:var(--muted);letter-spacing:.01em}
.rx b{color:var(--ink);font-weight:600}
figure{margin:0;background:var(--well);position:relative}
figure .photo{position:relative;aspect-ratio:3/2;max-width:100%;overflow:hidden;background:var(--well)}
figure .photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.photo .b,.photo .c1{opacity:0;animation:flipB var(--dur,3.4s) infinite}
.photo .c0{animation:flipA var(--dur,3.4s) infinite}
@keyframes flipB{0%,42%{opacity:0}50%,92%{opacity:1}100%{opacity:0}}
@keyframes flipA{0%,42%{opacity:1}50%,92%{opacity:0}100%{opacity:1}}
.photo.paused img,.photo.paused .chip{animation-play-state:paused}
.photo.single .b,.photo.single .chip{display:none}
.photo.show-b .b,.photo.show-b .c1{opacity:1}.photo.show-b .c0{opacity:0}
.photo video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:transparent;display:block;opacity:0;transition:opacity .25s}
.photo video.live{opacity:1}
.photo .vposter{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo.tall .vposter{object-fit:contain;background:#0c0d0f}
video::-webkit-media-controls,video::-webkit-media-controls-overlay-play-button,video::-webkit-media-controls-start-playback-button,video::-webkit-media-controls-panel{display:none!important;-webkit-appearance:none;opacity:0!important}
.photo.tall video{object-fit:contain}
.photo.isvid .chip{animation:none;opacity:1}
.photo.needtap::after{content:"Tap to play";position:absolute;inset:auto 0 42% 0;margin:auto;width:max-content;font:600 .85rem var(--body);color:#fff;background:rgba(12,13,15,.75);padding:8px 14px;border-radius:999px}
.vcredit{position:absolute;right:8px;bottom:8px;font:500 .64rem var(--mono);line-height:1.3;color:#fff;background:rgba(12,13,15,.6);padding:3px 8px;border-radius:6px;text-decoration:none;max-width:calc(100% - 16px);backdrop-filter:blur(6px)}
.vnote{margin:0;padding:10px 16px;font-size:.84rem;line-height:1.45;color:var(--muted);background:var(--panel)}
.chip{position:absolute;left:10px;top:10px;font:600 .64rem var(--mono);letter-spacing:.08em;text-transform:uppercase;background:rgba(12,13,15,.62);color:#fff;padding:4px 8px;border-radius:6px;backdrop-filter:blur(6px)}
figure canvas{display:block;width:100%;height:auto;aspect-ratio:220/160;max-width:100%}
.flip{position:relative;perspective:1400px}
.flip>.fface{min-width:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .55s cubic-bezier(.3,.1,.2,1)}
.flip>.fback{position:absolute;inset:0;transform:rotateY(180deg);background:var(--ink);color:var(--bg);display:flex;flex-direction:column;justify-content:center;gap:8px;padding:12px 44px 12px 16px;cursor:pointer;overflow:auto}
.flip.on>.ffront{transform:rotateY(-180deg)}.flip.on>.fback{transform:rotateY(0)}
.ffront{position:relative;cursor:pointer}
.fliphint{position:absolute;right:10px;top:10px;z-index:2;display:flex;align-items:center;gap:6px;font:600 .72rem var(--body);background:rgba(12,13,15,.62);color:#fff;padding:5px 10px 5px 8px;border-radius:999px;backdrop-filter:blur(6px);pointer-events:none}
.fliphint svg{width:15px;height:15px}
.fback dl{margin:0;display:grid;gap:7px}
.fback dl div{display:grid;gap:2px}
.fback dt{font:600 .62rem var(--mono);letter-spacing:.09em;text-transform:uppercase;opacity:.58}
.fback dd{margin:0;font-size:.88rem;line-height:1.28}
.fback dl div.key dd{font-weight:650}
.fback dl div.key dt{opacity:.9}
.fback .back{position:absolute;right:10px;top:10px;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;border:1.5px solid currentColor;opacity:.55}
.fback .back svg{width:14px;height:14px}
@media (prefers-reduced-motion:reduce){.flip>.fface{transition:none}}
figcaption{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;font-size:.84rem;color:var(--muted);background:var(--panel)}
figcaption .mus{display:flex;align-items:center;gap:7px;min-width:0}
figcaption .mus::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
.capbtns{display:flex;gap:6px;align-items:center;flex:none}
.seg{display:inline-flex;background:var(--well);border-radius:8px;padding:2px}
.seg button{font:600 .74rem var(--body);color:var(--muted);background:none;border:0;padding:4px 9px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.pp{font:600 .74rem var(--body);color:var(--ink);background:var(--well);border:0;border-radius:8px;padding:6px 10px;cursor:pointer;flex:none}
.last{margin:0;padding:12px 16px 0;font:500 .78rem var(--mono);color:var(--muted)}
.last .up{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:6px;background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);font-weight:600}
.sets{padding:10px 16px 14px;display:grid;gap:9px}
.sethead,.setrow{display:grid;grid-template-columns:1.6rem 1fr 1fr 2.75rem;gap:8px;align-items:center}
.sethead{font:600 .7rem var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding-bottom:2px}
.sethead span:first-child,.sethead span:last-child{text-align:center}
.hint{margin:6px 0 0;font-size:.82rem;color:var(--muted);line-height:1.45}
.setrow .n{font:600 .82rem var(--mono);color:var(--muted);text-align:center}
.field{display:flex;align-items:center;border-radius:10px;background:var(--well);min-width:0;border:1px solid transparent;transition:border-color .15s,background .15s}
.field input{width:100%;min-width:0;border:0;background:none;font:600 1.02rem var(--mono);color:var(--ink);padding:10px 2px 10px 11px}
.field span{font:500 .7rem var(--mono);color:var(--muted);padding-right:10px;white-space:nowrap}
.field input:focus,.field input:focus-visible{outline:none}
.field:focus-within{border-color:var(--accent);background:var(--panel)}
.field.off{visibility:hidden}
/* Done = a weight plate: hollow ring until you rack it. */
.done{position:relative;width:3.1rem;height:3.1rem;border-radius:50%;border:0;background:none;cursor:pointer;display:grid;place-items:center;justify-self:center;padding:0;-webkit-tap-highlight-color:transparent;color:var(--red);transition:transform .12s}
.done::before{content:none}
.done .db{position:relative;z-index:1;width:100%;height:100%;color:var(--red);filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));transition:color .25s,transform .45s cubic-bezier(.3,1.4,.5,1)}
.done .tk{position:absolute;z-index:2;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:50%;background:var(--panel);box-shadow:0 0 0 2px var(--ok);display:grid;place-items:center;opacity:0;transform:scale(.3);transition:opacity .15s,transform .3s cubic-bezier(.3,1.6,.5,1)}
.done .tk svg{width:12px;height:12px;color:var(--ok)}
.done>svg:not(.db){position:relative;z-index:1;width:20px;height:20px;color:var(--red)}
.done[aria-pressed="true"]::before{background:var(--ok);border-color:var(--ok)}
.done[aria-pressed="true"] .db{color:var(--ok);transform:rotate(360deg)}
.done[aria-pressed="true"] .tk{opacity:1;transform:scale(1)}
.done[aria-pressed="true"]>svg:not(.db){color:var(--onok)}
.done:active{transform:scale(.9)}
.done.pop{animation:spin .55s cubic-bezier(.3,1.4,.5,1)}
@keyframes spin{0%{transform:scale(.7) rotate(-90deg)}60%{transform:scale(1.12) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
.done .ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--ok);pointer-events:none;animation:ring .6s ease-out forwards}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(1.8);opacity:0}}
.setrow{position:relative;border-radius:12px}
.setrow.flash::before{content:"";position:absolute;inset:-3px -6px;border-radius:12px;background:var(--ok);opacity:0;animation:flash .7s ease-out;pointer-events:none}
@keyframes flash{0%{opacity:.2}100%{opacity:0}}
.setrow.is-done .field input{color:var(--muted)}
.setrow.is-done .n{color:var(--ok)}
.gain{position:absolute;right:0;top:0;font:700 .8rem var(--mono);color:var(--ok);pointer-events:none;white-space:nowrap;animation:gain 1.1s ease-out forwards;z-index:2}
@keyframes gain{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(0,-130%);opacity:0}}
/* Card barbell: one plate per set, mirrored on both sleeves. */
.ex-head{grid-template-columns:auto 1fr auto}
.ex-head .rx{grid-column:2/4}
.cardbar{grid-row:1;grid-column:3;align-self:center;width:112px;height:30px;display:block;overflow:visible}
.cardbar .pl{transition:fill .25s,stroke .25s}
.cardbar .pl.off{fill:transparent;stroke:var(--muted);stroke-dasharray:2 2;stroke-width:1}
.cardbar .pl.on{fill:var(--ok);stroke:none}
.cardbar .pl.in{transform-box:fill-box;transform-origin:center;animation:slidein .4s cubic-bezier(.2,1.3,.4,1)}
.cardbar .pl.in.l{animation-name:slidein-l}
@keyframes slidein{from{transform:translateX(14px);opacity:0}}
@keyframes slidein-l{from{transform:translateX(-14px);opacity:0}}
.cardbar.lift{animation:lift 1s cubic-bezier(.3,.9,.3,1)}
@keyframes lift{0%{transform:translateY(0)}35%{transform:translateY(-10px)}55%{transform:translateY(-10px) }100%{transform:translateY(0)}}
/* Completed exercise folds into a summary strip. */
.exsum{display:none;width:100%;border:0;background:none;color:inherit;text-align:left;cursor:pointer;padding:0 16px 14px;font:500 .8rem var(--mono);color:var(--muted)}
.exsum b{color:var(--ink);font-weight:600}
.exsum .vol{display:block;margin-top:4px}
.exsum .tag{display:inline-block;font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--onok);background:var(--ok);padding:3px 7px;border-radius:6px;margin-right:8px;vertical-align:1px}
.exsum .edit{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--well);color:var(--ink);transition:background .15s}
.ex.complete.folded{position:relative;padding-right:64px}
.ex.complete.folded .rx,.ex.complete.folded .cardbar{display:none}
.ex.complete.folded .ex-head{padding-bottom:6px}
.ex.complete.folded .exsum{padding-top:0}
.ex.complete.folded:active .edit{background:var(--ok);color:var(--onok)}
.ex.complete.folded .exsum{display:block}
.ex.complete.folded{cursor:pointer;transition:transform .12s,background .15s;-webkit-tap-highlight-color:transparent}
.ex.complete.folded:active{transform:scale(.985);background:var(--well)}
.ex.complete:not(.folded) .ex-head{cursor:pointer}
.ex.complete:not(.folded) .ex-head::after{content:"Tap to fold";grid-column:2/4;font:500 .72rem var(--mono);color:var(--muted);margin-top:4px}
.ex.complete.folded figure,.ex.complete.folded .last,.ex.complete.folded .sets,.ex.complete.folded details,.ex.complete.folded .vnote{display:none}
/* Session rail: each exercise as a plate seen face-on; the ring fills set by set. */
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:12px max(16px,env(safe-area-inset-left,0px)) 12px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:grid;gap:10px}
.rail .rt{display:flex;align-items:center;gap:12px;font:600 .82rem var(--mono);color:var(--muted);white-space:nowrap}
.rail .rt b{font:700 1.45rem/1 var(--mono);color:var(--ink);letter-spacing:-.02em}
.rail .rt .bar{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.rail .rt .bar i{display:block;height:100%;border-radius:4px;background:var(--ok);transition:width .5s cubic-bezier(.3,1,.4,1)}
.rail .plates{display:flex;justify-content:space-between;gap:4px;min-width:0}
.rail button{flex:0 1 46px;min-width:0;aspect-ratio:1;padding:0;border:0;background:none;cursor:pointer;position:relative}
.rail svg{width:100%;height:100%;display:block;overflow:visible}
.rail .trk{stroke:var(--line)}
.rail .arc{stroke:var(--ok);transition:stroke-dashoffset .5s cubic-bezier(.3,1,.4,1)}
.rail .face{fill:var(--panel)}
.rail .full .face{fill:var(--ok)}
.rail .num{font:700 11px var(--mono);fill:var(--ink)}
.rail .full .num{fill:var(--onok)}

const LEN = {th:32,sh:32,to:44,ua:23,fa:21,hd:13,ft:11};
const RAD = Math.PI/180;
const vec = (a,l)=>[Math.cos(a*RAD)*l, Math.sin(a*RAD)*l];
const add = (p,q)=>[p[0]+q[0],p[1]+q[1]];
const sub = (p,q)=>[p[0]-q[0],p[1]-q[1]];
const mix = (p,q,t)=>[p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t];
const dist=(p,q)=>Math.hypot(p[0]-q[0],p[1]-q[1]);
function lerpPose(a,b,t){
  const o={};
  for(const k in a){
    const x=a[k], y=(k in b)?b[k]:x;
    if(Array.isArray(x)) o[k]=[x[0]+(y[0]-x[0])*t, x[1]+(y[1]-x[1])*t];
    else if(typeof x==="number") o[k]=x+(y-x)*t;
    else o[k]=x;
  }
  return o;
}
function poseAt(ex,t){ const an=ex.anim; return lerpPose(an.A, Object.assign({},an.A,an.B), t); }
function solve(p){
  if(p.front) return solveFront(p);
  let P;
  if(p.foot){ const K=sub(p.foot,vec(p.sh,LEN.sh)); P=sub(K,vec(p.th,LEN.th)); }
  else P=p.hip;
  const J={P,p};
  J.K=add(P,vec(p.th,LEN.th)); J.A=add(J.K,vec(p.sh,LEN.sh)); J.T=add(J.A,vec(p.ft||0,LEN.ft));
  if(p.th2!=null){ J.K2=add(P,vec(p.th2,LEN.th)); J.A2=add(J.K2,vec(p.sh2,LEN.sh)); J.T2=add(J.A2,vec(p.ft2!=null?p.ft2:(p.ft||0),LEN.ft)); }
  J.S=add(P,vec(p.to,LEN.to)); J.N=add(J.S,vec(p.to,5)); J.H=add(J.S,vec(p.to,LEN.hd));
  J.E=add(J.S,vec(p.ua,LEN.ua)); J.W=add(J.E,vec(p.fa,LEN.fa));
  if(p.ua2!=null){ J.E2=add(J.S,vec(p.ua2,LEN.ua)); J.W2=add(J.E2,vec(p.fa2,LEN.fa)); }
  return J;
}
function solveFront(p){
  const cx=p.cx, J={p,front:1};
  J.Sr=[cx+14,36]; J.Sl=[cx-14,36]; J.P=[cx,80]; J.H=[cx,20];
  J.Er=add(J.Sr,vec(p.ua,LEN.ua)); J.Wr=add(J.Er,vec(p.fa,LEN.fa));
  J.El=add(J.Sl,vec(180-p.ua,LEN.ua)); J.Wl=add(J.El,vec(180-p.fa,LEN.fa));
  return J;
}

/* drawing primitives */
function capsule(c,a,b,ra,rb,col){
  const ang=Math.atan2(b[1]-a[1],b[0]-a[0]), n=ang+Math.PI/2;
  c.fillStyle=col; c.beginPath();
  c.moveTo(a[0]+Math.cos(n)*ra,a[1]+Math.sin(n)*ra);
  c.lineTo(b[0]+Math.cos(n)*rb,b[1]+Math.sin(n)*rb);
  c.arc(b[0],b[1],rb,n,n-Math.PI,true);
  c.lineTo(a[0]-Math.cos(n)*ra,a[1]-Math.sin(n)*ra);
  c.arc(a[0],a[1],ra,n+Math.PI,n,true);
  c.closePath(); c.fill();
}
function line(c,a,b,w,col){ c.strokeStyle=col; c.lineWidth=w; c.beginPath(); c.moveTo(a[0],a[1]); c.lineTo(b[0],b[1]); c.stroke(); }
function rrect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function plate(c,p,r){
  c.fillStyle=INK.ink; c.beginPath(); c.arc(p[0],p[1],r,0,7); c.fill();
  c.strokeStyle=INK.panel; c.lineWidth=1.2; c.beginPath(); c.arc(p[0],p[1],r*.62,0,7); c.stroke();
  c.fillStyle=INK.equip; c.beginPath(); c.arc(p[0],p[1],2.6,0,7); c.fill();
}
function dumbbell(c,p,ang){
  c.save(); c.translate(p[0],p[1]); c.rotate(ang*RAD);
  c.fillStyle=INK.ink; rrect(c,-8,-1.5,16,3,1); c.fill();
  rrect(c,-10,-5,5,10,1.5); c.fill(); rrect(c,5,-5,5,10,1.5); c.fill();
  c.restore();
}

function drawBody(c,J,col,farCol){

  if(J.K2){ capsule(c,J.P,J.K2,...BODY.th,farCol); capsule(c,J.K2,J.A2,...BODY.sh,farCol); capsule(c,J.A2,J.T2,3.2,2.6,farCol); }
  if(J.E2){ capsule(c,J.S,J.E2,...BODY.ua,farCol); capsule(c,J.E2,J.W2,...BODY.fa,farCol); c.fillStyle=farCol; c.beginPath(); c.arc(J.W2[0],J.W2[1],3.2,0,7); c.fill(); }

function checkins(){ const d=st.docs.checkins; return (d&&Array.isArray(d.entries))?d.entries.slice().sort((a,b)=>a.date<b.date?-1:1):[]; }
function profile(){ return st.docs.profile||{}; }
function spark(entries,key,unit,color){
  const pts=entries.filter(e=>e[key]!=null);
  if(pts.length<2) return `<p class="empty">${pts.length? "One entry so far. The line appears after your second check-in.":"No entries yet."}</p>`;
  const W=320,H=110,pl=34,pr=10,pt=12,pb=22;
  const vals=pts.map(p=>p[key]); let lo=Math.min(...vals), hi=Math.max(...vals); if(hi-lo<1){ lo-=.5; hi+=.5; }
  const x=(i)=>pl+(W-pl-pr)*i/(pts.length-1), y=(v)=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  const d=pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p[key]).toFixed(1)).join(" ");
  const area=d+` L${x(pts.length-1).toFixed(1)} ${H-pb} L${pl} ${H-pb} Z`;
  const lastP=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="${key} trend">
    <line x1="${pl}" y1="${y(hi)}" x2="${W-pr}" y2="${y(hi)}" stroke="var(--line)"/><line x1="${pl}" y1="${y(lo)}" x2="${W-pr}" y2="${y(lo)}" stroke="var(--line)"/>
    <text x="${pl-6}" y="${y(hi)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${+hi.toFixed(1)}</text>
    <text x="${pl-6}" y="${y(lo)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${+lo.toFixed(1)}</text>
    <path d="${area}" fill="${color}" opacity=".12"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2.2"/>
    ${pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p[key]).toFixed(1)}" r="${i===pts.length-1?4:2.6}" fill="${color}"/>`).join("")}
    <text x="${pl}" y="${H-6}" font-size="10" fill="var(--muted)">${esc(fmtDate(pts[0].date))}</text>
    <text x="${W-pr}" y="${H-6}" font-size="10" fill="var(--muted)" text-anchor="end">${esc(fmtDate(lastP.date))} · ${lastP[key]} ${unit}</text></svg>`;

function compBlock(){

  const max=W, bw=262, x0=8;

const WHYEX={"fly": "Gives your chest a second day each week, about 10 hard sets in total, which builds more muscle than training it once. The fly works the chest on its own through a big stretch, without your shoulders and triceps taking over as they do in presses. Weight is per side.", "bench": "Your main chest builder. It works the most upper-body muscle in one move, so it builds and burns the most, and the barbell lets you add small 2.5 kg steps you can track week to week.", "ohp": "Seated with back support keeps your lower back out of it, which is safer at your age than a standing barbell press. Dumbbells let each shoulder move in its own natural path.", "incdb": "Builds the upper chest, the part that shapes the chest-to-shoulder line in a t-shirt. Dumbbells are easier on the shoulders than an incline barbell.", "lat": "Wider side shoulders make your waist look narrower while the belly fat is still coming off. Light weight, very low joint stress.", "push": "Triceps make up most of your upper arm. The cable keeps tension on the whole rep and is gentle on the elbows.", "plank": "Teaches you to brace your trunk, the same skill that protects your lower back on squats and Romanian deadlifts.", "squat": "Trains your biggest muscles, so it's the main leg builder and the biggest calorie burner of the week. Go as deep as you can while your back stays neutral; most people your size find a deep squat comfortable.", "lp": "Adds leg work without putting the bar on your spine, which helps on the second of four days in a row. At your height, set the seat so your knees reach about 90° without your lower back lifting off the pad.", "lunge": "Trains one leg at a time to even out left–right differences and build balance. Stepping back is easier on the knees than stepping forward.", "lext": "Targets the front of the thigh directly and keeps the knees strong. With shorter legs you'll usually need to move the shin pad up so your knee lines up with the machine's pivot.", "calf": "Calves respond to slow, full-range reps. Strong calves and ankles also make your daily walking easier.", "deadbug": "Trains your abs to stop your lower back arching, which is what protects it, without straining your neck like crunches can.", "pd": "Builds back width, which makes the waist look narrower. Easier to adjust than pull-ups at your current body weight; it's the path to doing your first pull-ups.", "row": "Balances all the pressing to protect your shoulders and posture, especially after days at a desk. Resting a hand on the bench takes strain off your lower back.", "crow": "Thickens the middle of your back and pulls the shoulders back for better posture.", "face": "Strengthens the rear shoulders and the small rotator-cuff muscles. Cheap insurance for shoulder health in your late 30s and beyond when you do a lot of pressing.", "curl": "Direct biceps work: small, low-risk and quick to show results.", "hkr": "Works the lower abs and your grip, and hanging gently decompresses your spine after a heavy week.", "rdl": "Builds hamstrings and glutes and teaches the hip hinge you use to lift anything safely in daily life. Stopping at mid-shin puts less strain on your lower back than a full deadlift from the floor.", "ht": "Glutes are your biggest muscle, and strong glutes take load off your lower back. No weight on your spine.", "lcurl": "Balances the leg extensions by training the back of the thigh, which helps keep knees healthy.", "goblet": "Holding the weight in front keeps your torso upright, so it's extra squat practice that is easy on the back and teaches good form.", "hammer": "Builds the forearms and the muscle under the biceps, and strengthens your grip for rows and carries.", "ohe": "The long head of the triceps is only fully worked with the arm overhead, so this fills the gap the pushdown leaves.", "carry": "Builds grip, core and posture at once, burns plenty of calories, and is the most real-life strength you'll train."};

/* One-tap setup link: …/gym/#connect=<Web app URL> connects this device, then the link is wiped from the address bar. */
function takeSetupLink(){
  const h=location.hash; if(!h.startsWith("#connect=")) return false;
  let u=""; try{ u=decodeURIComponent(h.slice(9)); }catch(e){}
  try{ history.replaceState(null,"",location.pathname+"#mon"); }catch(e){ location.hash="mon"; }
  if(/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u)){ try{ localStorage.setItem(CONN_KEY,u); }catch(e){} return true; }
  return false;
}
